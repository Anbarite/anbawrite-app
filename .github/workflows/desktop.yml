name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Private source tag to build (for example, desktop-v1.2.3)
        required: true
        type: string
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'push' && github.ref_name || inputs.source_tag }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.source_tag }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.release-state.outputs.already_published }}
    steps:
      - name: Check out release automation
        uses: actions/checkout@v6

      - name: Check release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$SOURCE_TAG" != desktop-v* || "$SOURCE_TAG" == "desktop-v" ]]; then
            echo "SOURCE_TAG must use the desktop-v<version> format." >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/release.json"
          already_published=false

          set +e
          .github/scripts/find-desktop-release.sh \
            "$SOURCE_TAG" "$release_json" 4
          find_status=$?
          set -e

          if ((find_status == 0)); then
            draft="$(
              jq -er '
                if (.draft | type) == "boolean" then
                  (.draft | tostring)
                else
                  error("release draft state is missing")
                end
              ' "$release_json"
            )"
            if [[ "$draft" == "false" ]]; then
              already_published=true
              echo "Release $SOURCE_TAG is already published; the build will be skipped."
            else
              echo "Release $SOURCE_TAG is still a draft and can be updated."
            fi
          elif ((find_status == 4)); then
            echo "Release $SOURCE_TAG does not exist yet."
          else
            exit "$find_status"
          fi

          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges platform entries by replacing latest.json.
      # Serialize jobs so concurrent read-modify-write uploads cannot lose entries.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v6
        with:
          repository: Anbarite/anbawrite
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.ANBAWRITE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Read release notes from source tag
        id: release-notes
        shell: bash
        run: |
          release_body=""
          if git rev-parse --verify --quiet \
            "refs/tags/$SOURCE_TAG^{tag}" > /dev/null 2>&1; then
            release_body="$(
              git for-each-ref \
                --format='%(contents:subject)%0a%0a%(contents:body)' \
                "refs/tags/$SOURCE_TAG"
            )"
          fi

          if [[ -z "${release_body//[[:space:]]/}" ]]; then
            release_body="Automated desktop release for $SOURCE_TAG."
          fi

          while true; do
            delimiter="ANBAWRITE_RELEASE_NOTES_${RANDOM}_${RANDOM}_$$"
            if ! grep -Fqx "$delimiter" <<< "$release_body"; then
              break
            fi
          done

          {
            printf 'body<<%s\n' "$delimiter"
            printf '%s\n' "$release_body"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure signed updater
        env:
          DESKTOP_RELEASE_TAG: ${{ env.SOURCE_TAG }}
          DESKTOP_UPDATER_ENDPOINT: https://github.com/Anbarite/anbawrite-app/releases/latest/download/latest.json
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run desktop:configure-updater

      - name: Configure Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No Windows signing certificate is configured."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL must be configured for signed builds."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "anbawrite-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 4 |
            Set-Content src-tauri/tauri.windows.conf.json

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_VALUE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_VALUE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_VALUE" ]]; then
            echo "No macOS signing certificate is configured."
            exit 0
          fi

          append_env() {
            local name="$1"
            local value="$2"
            local delimiter="ANBAWRITE_$(uuidgen)"

            while printf '%s\n' "$value" | grep -Fqx "$delimiter"; do
              delimiter="ANBAWRITE_$(uuidgen)"
            done

            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }

          append_env_if_set() {
            if [[ -n "$2" ]]; then
              append_env "$1" "$2"
            fi
          }

          append_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE_VALUE"
          append_env_if_set APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_VALUE"
          append_env_if_set APPLE_ID "$APPLE_ID_VALUE"
          append_env_if_set APPLE_PASSWORD "$APPLE_PASSWORD_VALUE"
          append_env_if_set APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY_VALUE"
          append_env_if_set APPLE_TEAM_ID "$APPLE_TEAM_ID_VALUE"

      - name: Build and package AnbaWrite
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DESKTOP_UPDATER_ENABLED: "true"
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          releaseName: AnbaWrite Desktop v__VERSION__
          tagName: ${{ env.SOURCE_TAG }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true

  publish:
    needs:
      - prepare
      - build
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.prepare.outputs.already_published == 'true' ||
          needs.build.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release automation
        uses: actions/checkout@v6

      - name: Validate and publish draft release
        shell: bash
        env:
          ALREADY_PUBLISHED: ${{ needs.prepare.outputs.already_published }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "Release $SOURCE_TAG is already published; no assets were changed."
            exit 0
          fi

          release_json="$RUNNER_TEMP/release.json"
          final_release_json="$RUNNER_TEMP/final-release.json"
          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"

          .github/scripts/find-desktop-release.sh \
            "$SOURCE_TAG" "$release_json" 6

          release_id="$(jq -er '.id' "$release_json")"
          latest_asset_id="$(
            jq -er '
              [.assets[] | select(.name == "latest.json")] |
              if length == 1 then
                .[0].id
              else
                error("draft release must contain exactly one latest.json")
              end
            ' "$release_json"
          )"

          manifest="$assets_dir/latest.json"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$latest_asset_id" \
            > "$manifest"

          .github/scripts/validate-desktop-release.sh \
            "$SOURCE_TAG" "$release_json" "$manifest"

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$final_release_json"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --argjson id "$release_id" \
            --argjson latest_asset_id "$latest_asset_id" '
              .id == $id and
              .tag_name == $tag and
              .draft == true and
              ([.assets[] | select(
                .name == "latest.json" and .id == $latest_asset_id
              )] | length == 1)
            ' "$final_release_json" > /dev/null || {
              echo "Draft release changed during validation; refusing to publish." >&2
              exit 1
            }
          .github/scripts/validate-desktop-release.sh \
            "$SOURCE_TAG" "$final_release_json" "$manifest"

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f make_latest=true |
            jq -e \
              --arg tag "$SOURCE_TAG" \
              --argjson id "$release_id" '
                .id == $id and .tag_name == $tag and .draft == false
              ' > /dev/null
